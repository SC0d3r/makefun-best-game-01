<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Lumenwing</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* The page letterboxes the fixed 16:9 stage inside any viewport. */
      #game {
        display: block;
        width: min(100vw, calc(100vh * 16 / 9));
        height: min(100vh, calc(100vw * 9 / 16));
        max-width: 100vw;
        max-height: 100vh;
        aspect-ratio: 16 / 9;
        background: #000;
        cursor: default;
        outline: none;
        touch-action: none;
        box-shadow:
          0 0 70px rgba(110, 220, 205, 0.16),
          0 28px 90px rgba(0, 0, 0, 0.82);
      }

      /* Announcements stay in the accessibility tree but never take space. */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <canvas
      id="game"
      width="1280"
      height="720"
      tabindex="0"
      aria-label="Lumenwing, a lantern moth flying through three sleeping gardens"
    ></canvas>
    <div id="status" class="sr-only" role="status" aria-live="polite"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
